plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// The app's original CountingRequestBody used Okio ForwardingSink. That API is
// not compatible with the current OkHttp/Okio combination, so transform the
// source immediately before Kotlin compilation. Regex is intentionally used
// here so CRLF/LF and harmless indentation changes cannot break the patch.
tasks.register('patchUploadProgress') {
    outputs.upToDateWhen { false }
    doLast {
        def sourceFile = file('src/main/java/com/photosync/uploader/MainActivity.kt')
        def text = sourceFile.getText('UTF-8')
        def patched = text

        // Remove obsolete Okio imports, regardless of line ending.
        patched = patched.replaceAll(/(?m)^\s*import okio\.ForwardingSink\s*\r?\n/, '')
        patched = patched.replaceAll(/(?m)^\s*import okio\.buffer\s*\r?\n/, '')

        // Replace the upload wrapper and its callback block with the plain
        // multipart body. DOTALL keeps this independent of line formatting.
        def uploadPattern = /(?s)val\s+counted\s*=\s*CountingRequestBody\(multipart\)\s*\{.*?\n\s*\}\s*\n(\s*val\s+request\s*=)/
        def uploadMatcher = (patched =~ uploadPattern)
        if (!uploadMatcher.find()) {
            throw new GradleException('PhotoSync patch: CountingRequestBody upload block was not found')
        }
        patched = uploadMatcher.replaceFirst('val counted = multipart\n$1')

        // Wrap only the actual temporary file body so progress reflects bytes
        // written to the network, not just time elapsed.
        def oldBodyPattern = /temp\.asRequestBody\(mime\.toMediaType\(\)\)/
        if (!(patched =~ oldBodyPattern).find()) {
            throw new GradleException('PhotoSync patch: temporary file RequestBody was not found')
        }
        def newBody = '''ProgressFileRequestBody(temp, mime.toMediaType()) { sent, total ->
                        val percent = if (total > 0L) ((sent * 100L) / total).toInt().coerceIn(0, 100) else 0
                        handler.post {
                            val row = activeProgressRows[progressKey]
                            val bar = row?.findViewWithTag<ProgressBar>("progress_bar")
                            if (bar != null) bar.progress = percent
                        }
                    }'''
        patched = patched.replaceFirst(oldBodyPattern, newBody)

        // Replace the old helper through the end of MainActivity. It is the
        // final private class in this source file.
        def helperPattern = /(?s)\s*private\s+class\s+CountingRequestBody\s*\(.*?\n\}\s*$/
        def helperMatcher = (patched =~ helperPattern)
        if (!helperMatcher.find()) {
            throw new GradleException('PhotoSync patch: CountingRequestBody class was not found')
        }
        def helper = '''

    private class ProgressFileRequestBody(
        private val file: File,
        private val mediaType: MediaType?,
        private val onProgress: (written: Long, total: Long) -> Unit
    ) : RequestBody() {
        override fun contentType(): MediaType? = mediaType

        override fun contentLength(): Long = file.length()

        override fun writeTo(sink: BufferedSink) {
            val total = contentLength()
            var written = 0L
            file.inputStream().use { input ->
                val buffer = ByteArray(64 * 1024)
                while (true) {
                    val read = input.read(buffer)
                    if (read <= 0) break
                    sink.write(buffer, 0, read)
                    written += read
                    onProgress(written, total)
                }
            }
        }
    }
}
'''
        patched = helperMatcher.replaceFirst(helper)

        // Do not allow the old implementation to reach the compiler.
        if (patched.contains('CountingRequestBody') || patched.contains('ForwardingSink') || patched.contains('okio.buffer')) {
            throw new GradleException('PhotoSync patch validation failed: legacy Okio progress implementation remains')
        }
        if (!patched.contains('class ProgressFileRequestBody')) {
            throw new GradleException('PhotoSync patch validation failed: ProgressFileRequestBody was not inserted')
        }

        sourceFile.write(patched, 'UTF-8')
        println 'PhotoSync: upload progress source patch applied.'
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) {
        task.dependsOn('patchUploadProgress')
    }
}
