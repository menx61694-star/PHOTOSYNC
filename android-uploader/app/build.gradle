plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio-jvm:3.6.0'
}

// Fix the malformed multiline file-row label in MainActivity before Kotlin compilation.
tasks.register('fixKotlinSourceFormatting') {
    outputs.upToDateWhen { false }
    doLast {
        def sourceFile = file('src/main/java/com/photosync/uploader/MainActivity.kt')
        def lines = sourceFile.readLines('UTF-8')
        def fixed = []
        def changed = false
        int i = 0
        while (i < lines.size()) {
            if (i + 1 < lines.size()
                    && lines[i].contains('text = "$name\\')
                    && lines[i + 1].trim() == '\${formatSize(size)}"') {
                fixed << '            text = "$name\\n\${formatSize(size)}"'
                changed = true
                i += 2
            } else {
                fixed << lines[i]
                i++
            }
        }
        if (changed) {
            sourceFile.write(fixed.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            println 'PhotoSync: fixed malformed file-row label string.'
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) {
        task.dependsOn('fixKotlinSourceFormatting')
    }
}
