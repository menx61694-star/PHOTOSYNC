plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// Patch the Android source before Kotlin compilation. This avoids Okio's sealed
// ForwardingSink/BufferedSink implementation issue while keeping real byte-level
// upload progress through ProgressFileRequestBody.
tasks.register('patchCountingRequestBody') {
    outputs.upToDateWhen { false }
    doLast {
        def sourceFile = file('src/main/java/com/photosync/uploader/MainActivity.kt')
        def text = sourceFile.getText('UTF-8')
        def patched = text

        // Remove the sealed-interface import.
        patched = patched.replace('import okio.ForwardingSink\n', '')

        // Replace the multipart CountingRequestBody block in upload().
        def countedStart = patched.indexOf('                val counted = CountingRequestBody(multipart) {')
        if (countedStart >= 0) {
            def requestStart = patched.indexOf('                val request =', countedStart)
            if (requestStart > countedStart) {
                patched = patched.substring(0, countedStart) +
                    '                val counted = multipart\n' +
                    patched.substring(requestStart)
            }
        }

        // Make the actual temporary file body report bytes written.
        patched = patched.replace(
            'temp.asRequestBody(mime.toMediaType())',
            '''ProgressFileRequestBody(temp, mime.toMediaType()) { sent, total ->
                        val percent = if (total > 0L) ((sent * 100L) / total).toInt().coerceIn(0, 100) else 0
                        handler.post {
                            val row = activeProgressRows[progressKey]
                            val bar = row?.findViewWithTag<ProgressBar>("progress_bar")
                            if (bar != null) bar.progress = percent
                        }
                    }'''
        )

        // Remove the old ForwardingSink-based helper from the end of MainActivity.
        def helperStart = patched.indexOf('    private class CountingRequestBody(')
        if (helperStart >= 0) {
            def finalBrace = patched.lastIndexOf('\n}')
            if (finalBrace > helperStart) {
                patched = patched.substring(0, helperStart) + '\n}' + '\n'
            }
        }

        if (patched != text) {
            sourceFile.write(patched, 'UTF-8')
        }
    }
}

// Run the patch immediately before Kotlin compilation, not merely before the
// Android preBuild task, so Gradle cannot skip it as an up-to-date preBuild.
tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) {
        task.dependsOn('patchCountingRequestBody')
    }
}
