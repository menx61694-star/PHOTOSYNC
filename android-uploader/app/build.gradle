plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// Work around the Kotlin/Okio ForwardingSink sealed-interface compilation issue.
// The transfer-progress implementation keeps the same behavior by delegating
// BufferedSink directly and counting bytes in write().
tasks.register('patchCountingRequestBody') {
    doLast {
        def sourceFile = file('src/main/java/com/photosync/uploader/MainActivity.kt')
        def text = sourceFile.getText('UTF-8')
        def patched = text
            .replace('import okio.ForwardingSink\\n', '')
            .replace('object : ForwardingSink(sink) {', 'object : BufferedSink by sink {')
            .replace('                    super.write(source, byteCount)', '                    sink.write(source, byteCount)')
        if (patched != text) {
            sourceFile.write(patched, 'UTF-8')
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'patchCountingRequestBody'
}
