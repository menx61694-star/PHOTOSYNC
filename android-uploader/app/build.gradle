plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// Build-time source patch: avoid Okio ForwardingSink (sealed-interface compilation issue)
// while retaining a real byte-level upload progress callback for the file part.
tasks.register('patchCountingRequestBody') {
    doLast {
        def sourceFile = file('src/main/java/com/photosync/uploader/MainActivity.kt')
        def text = sourceFile.getText('UTF-8')
        def patched = text

        // Remove the problematic Okio import.
        patched = patched.replace('import okio.ForwardingSink\n', '')

        // Replace the Multipart wrapper progress implementation with a progress-aware file body.
        patched = patched.replaceFirst(
            '(?s)val counted = CountingRequestBody\\(multipart\\) \\{.*?\\n                \\}\\n                val request',
            'val counted = multipart\n                val request'
        )

        patched = patched.replace(
            'temp.asRequestBody(mime.toMediaType())',
            '''ProgressFileRequestBody(temp, mime.toMediaType()) { sent, total ->
                        val percent = if (total > 0L) ((sent * 100L) / total).toInt().coerceIn(0, 100) else 0
                        handler.post {
                            val row = activeProgressRows[progressKey]
                            val bar = row?.findViewWithTag<ProgressBar>("progress_bar")
                            if (bar != null) bar.progress = percent
                        }
                    }'''
        )

        // Replace the old ForwardingSink-based helper with a simple file RequestBody.
        patched = patched.replaceFirst(
            '(?s)    private class CountingRequestBody\\(.*?\\n    \\}\\n\\}',
            '''    private class ProgressFileRequestBody(
        private val file: File,
        private val mediaType: MediaType?,
        private val onProgress: (written: Long, total: Long) -> Unit
    ) : RequestBody() {
        override fun contentType(): MediaType? = mediaType
        override fun contentLength(): Long = file.length()
        override fun writeTo(sink: BufferedSink) {
            val total = contentLength()
            var written = 0L
            file.inputStream().use { input ->
                val buffer = ByteArray(64 * 1024)
                while (true) {
                    val read = input.read(buffer)
                    if (read <= 0) break
                    sink.write(buffer, 0, read)
                    written += read
                    onProgress(written, total)
                }
            }
        }
    }
}'''
        )

        if (patched != text) {
            sourceFile.write(patched, 'UTF-8')
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'patchCountingRequestBody'
}
