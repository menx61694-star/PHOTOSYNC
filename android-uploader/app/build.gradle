plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// The original source used Okio's ForwardingSink. In the current Okio API that
// type is sealed, so the old CountingRequestBody cannot compile. Patch the
// source immediately before Kotlin compilation with a plain RequestBody that
// writes the temporary file directly and reports byte-level progress.
tasks.register('patchCountingRequestBody') {
    outputs.upToDateWhen { false }
    doLast {
        def sourceFile = file('src/main/java/com/photosync/uploader/MainActivity.kt')
        def text = sourceFile.getText('UTF-8')
        def patched = text

        patched = patched.replace('import okio.ForwardingSink\n', '')
        patched = patched.replace('import okio.buffer\n', '')

        // Replace the multipart body used by upload().
        patched = patched.replace(
            'val counted = CountingRequestBody(multipart) { sent, total ->',
            'val counted = multipart'
        )

        // Remove the progress callback block that belonged to CountingRequestBody.
        def callbackStart = patched.indexOf('                val counted = multipart\n                    val percent =')
        if (callbackStart >= 0) {
            def requestStart = patched.indexOf('                val request =', callbackStart)
            if (requestStart > callbackStart) {
                patched = patched.substring(0, callbackStart) +
                    '                val counted = multipart\n' +
                    patched.substring(requestStart)
            }
        }

        // Make the multipart file part itself report bytes as OkHttp writes it.
        patched = patched.replace(
            'temp.asRequestBody(mime.toMediaType())',
            '''ProgressFileRequestBody(temp, mime.toMediaType()) { sent, total ->
                        val percent = if (total > 0L) ((sent * 100L) / total).toInt().coerceIn(0, 100) else 0
                        handler.post {
                            val row = activeProgressRows[progressKey]
                            val bar = row?.findViewWithTag<ProgressBar>("progress_bar")
                            if (bar != null) bar.progress = percent
                        }
                    }'''
        )

        // Replace the old sealed-ForwardingSink helper with a normal RequestBody.
        def helperStart = patched.indexOf('    private class CountingRequestBody(')
        if (helperStart >= 0) {
            def finalBrace = patched.lastIndexOf('\n}')
            if (finalBrace > helperStart) {
                def helper = '''    private class ProgressFileRequestBody(
        private val file: File,
        private val mediaType: MediaType?,
        private val onProgress: (written: Long, total: Long) -> Unit
    ) : RequestBody() {
        override fun contentType(): MediaType? = mediaType

        override fun contentLength(): Long = file.length()

        override fun writeTo(sink: BufferedSink) {
            val total = contentLength()
            var written = 0L
            file.inputStream().use { input ->
                val buffer = ByteArray(64 * 1024)
                while (true) {
                    val read = input.read(buffer)
                    if (read <= 0) break
                    sink.write(buffer, 0, read)
                    written += read
                    onProgress(written, total)
                }
            }
        }
    }
'''
                patched = patched.substring(0, helperStart) + helper + '}' + '\n'
            }
        }

        if (patched == text) {
            throw new GradleException('PhotoSync source patch made no changes; refusing to build an unpatched source tree.')
        }
        sourceFile.write(patched, 'UTF-8')
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) {
        task.dependsOn('patchCountingRequestBody')
    }
}
