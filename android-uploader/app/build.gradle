plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Decode the supplied app-icon Base64 into a normal Android drawable before resource processing.
def generatedIconDir = file("$projectDir/src/main/res/drawable")
tasks.register("generatePhotoSyncIcon") {
    inputs.file("src/main/app_icon_base64.txt")
    outputs.file(new File(generatedIconDir, "app_icon.jpg"))
    doLast {
        generatedIconDir.mkdirs()
        def encoded = file("src/main/app_icon_base64.txt").getText("UTF-8").trim()
        new File(generatedIconDir, "app_icon.jpg").bytes = java.util.Base64.decoder.decode(encoded)
    }
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.named("preBuild").configure {
    dependsOn("generatePhotoSyncIcon")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
