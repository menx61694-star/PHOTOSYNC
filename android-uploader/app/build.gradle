plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// Convert the legacy Okio ForwardingSink implementation to a plain RequestBody
// immediately before Kotlin compilation. This is deliberately index-based:
// it does not depend on line endings, indentation, or regex replacement rules.
tasks.register('patchUploadProgress') {
    outputs.upToDateWhen { false }
    doLast {
        def sourceFile = file('src/main/java/com/photosync/uploader/MainActivity.kt')
        def text = sourceFile.getText('UTF-8')
        def patched = text

        patched = patched.replaceAll(/(?m)^\s*import okio\.ForwardingSink\s*\r?\n/, '')
        patched = patched.replaceAll(/(?m)^\s*import okio\.buffer\s*\r?\n/, '')

        // Replace the old CountingRequestBody invocation with the multipart body.
        def countedStart = patched.indexOf('val counted = CountingRequestBody(multipart)')
        if (countedStart < 0) {
            throw new GradleException('PhotoSync patch: CountingRequestBody invocation not found')
        }
        def requestStart = patched.indexOf('val request =', countedStart)
        if (requestStart < 0) {
            throw new GradleException('PhotoSync patch: upload request declaration not found')
        }
        patched = patched.substring(0, countedStart) +
                'val counted = multipart\n                ' +
                patched.substring(requestStart)

        // Replace the actual file RequestBody with a body that reports bytes written.
        def oldBody = 'temp.asRequestBody(mime.toMediaType())'
        def bodyIndex = patched.indexOf(oldBody)
        if (bodyIndex < 0) {
            throw new GradleException('PhotoSync patch: temporary file RequestBody not found')
        }
        def newBody = '''ProgressFileRequestBody(temp, mime.toMediaType()) { sent, total ->
                        val percent = if (total > 0L) ((sent * 100L) / total).toInt().coerceIn(0, 100) else 0
                        handler.post {
                            val row = activeProgressRows[progressKey]
                            val bar = row?.findViewWithTag<ProgressBar>("progress_bar")
                            if (bar != null) bar.progress = percent
                        }
                    }'''
        patched = patched.substring(0, bodyIndex) + newBody + patched.substring(bodyIndex + oldBody.length())

        // Remove the old helper. It is the final class inside MainActivity.
        def helperStart = patched.lastIndexOf('\n    private class CountingRequestBody(')
        if (helperStart < 0) {
            throw new GradleException('PhotoSync patch: CountingRequestBody class not found')
        }
        def fileEnd = patched.lastIndexOf('\n}')
        if (fileEnd <= helperStart) {
            throw new GradleException('PhotoSync patch: MainActivity closing brace not found')
        }
        def helper = '''

    private class ProgressFileRequestBody(
        private val file: File,
        private val mediaType: MediaType?,
        private val onProgress: (written: Long, total: Long) -> Unit
    ) : RequestBody() {
        override fun contentType(): MediaType? = mediaType

        override fun contentLength(): Long = file.length()

        override fun writeTo(sink: BufferedSink) {
            val total = contentLength()
            var written = 0L
            file.inputStream().use { input ->
                val buffer = ByteArray(64 * 1024)
                while (true) {
                    val read = input.read(buffer)
                    if (read <= 0) break
                    sink.write(buffer, 0, read)
                    written += read
                    onProgress(written, total)
                }
            }
        }
    }
}'''
        patched = patched.substring(0, helperStart) + helper + '\n'

        if (patched.contains('CountingRequestBody') || patched.contains('ForwardingSink') || patched.contains('okio.buffer')) {
            throw new GradleException('PhotoSync patch validation failed: legacy progress implementation remains')
        }
        if (!patched.contains('class ProgressFileRequestBody')) {
            throw new GradleException('PhotoSync patch validation failed: new progress body missing')
        }

        sourceFile.write(patched, 'UTF-8')
        println 'PhotoSync: upload progress implementation patched successfully.'
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) {
        task.dependsOn('patchUploadProgress')
    }
}
