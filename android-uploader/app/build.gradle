plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// The source previously used Okio ForwardingSink. ForwardingSink is sealed in
// the Okio version used by this project, so compiling that source fails.
// Replace only that helper before Kotlin compilation with a plain RequestBody
// that copies through an intermediate Buffer and reports progress.
tasks.register('fixUploadProgressSource') {
    outputs.upToDateWhen { false }
    doLast {
        def sourceFile = file('src/main/java/com/photosync/uploader/MainActivity.kt')
        def text = sourceFile.getText('UTF-8')

        text = text.replace('import okio.ForwardingSink\\n', '')
        text = text.replace('import okio.buffer\\n', '')
        text = text.replace('import okio.ForwardingSink\r\n', '')
        text = text.replace('import okio.buffer\r\n', '')

        def start = text.lastIndexOf('    private class CountingRequestBody(')
        def end = text.lastIndexOf('\n}')
        if (start < 0 || end <= start) {
            throw new GradleException('PhotoSync: CountingRequestBody block could not be located')
        }

        def replacement = '''    private class CountingRequestBody(
        private val delegate: RequestBody,
        private val onProgress: (written: Long, total: Long) -> Unit
    ) : RequestBody() {
        override fun contentType(): MediaType? = delegate.contentType()

        override fun contentLength(): Long = delegate.contentLength()

        override fun writeTo(sink: BufferedSink) {
            val total = contentLength()
            val buffer = okio.Buffer()
            delegate.writeTo(buffer)
            var written = 0L
            while (!buffer.exhausted()) {
                val chunk = minOf(buffer.size, 64L * 1024L)
                sink.write(buffer, chunk)
                written += chunk
                onProgress(written, total)
            }
        }
    }
'''
        text = text.substring(0, start) + replacement + text.substring(end)

        if (text.contains('ForwardingSink') || text.contains('okio.buffer')) {
            throw new GradleException('PhotoSync: old sealed ForwardingSink implementation remains')
        }
        sourceFile.write(text, 'UTF-8')
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) {
        task.dependsOn(fixUploadProgressSource)
    }
}
