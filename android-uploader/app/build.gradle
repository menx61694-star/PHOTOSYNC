plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.photosync.uploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photosync.uploader'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// Patch the legacy CountingRequestBody before Kotlin compilation.
// The old implementation subclasses Okio ForwardingSink, which is sealed in
// the Okio version bundled with OkHttp 4.12. The replacement reports progress
// while the actual file bytes are written by OkHttp.
tasks.register('patchUploadProgress') {
    outputs.upToDateWhen { false }
    doLast {
        def sourceFile = file('src/main/java/com/photosync/uploader/MainActivity.kt')
        def text = sourceFile.getText('UTF-8')
        def patched = text

        // Remove obsolete Okio imports used only by CountingRequestBody.
        patched = patched.replace('import okio.ForwardingSink\n', '')
        patched = patched.replace('import okio.buffer\n', '')

        // Replace the whole CountingRequestBody call in upload().
        def uploadStart = patched.indexOf('                val counted = CountingRequestBody(multipart) {')
        if (uploadStart < 0) {
            throw new GradleException('PhotoSync patch: upload CountingRequestBody call was not found')
        }
        def requestStart = patched.indexOf('                val request =', uploadStart)
        if (requestStart < 0) {
            throw new GradleException('PhotoSync patch: upload Request.Builder was not found')
        }
        patched = patched.substring(0, uploadStart) +
                '                val counted = multipart\n' +
                patched.substring(requestStart)

        // Make the file part itself report bytes as OkHttp writes it.
        def oldBody = 'temp.asRequestBody(mime.toMediaType())'
        if (!patched.contains(oldBody)) {
            throw new GradleException('PhotoSync patch: temporary file RequestBody was not found')
        }
        def newBody = '''ProgressFileRequestBody(temp, mime.toMediaType()) { sent, total ->
                        val percent = if (total > 0L) ((sent * 100L) / total).toInt().coerceIn(0, 100) else 0
                        handler.post {
                            val row = activeProgressRows[progressKey]
                            val bar = row?.findViewWithTag<ProgressBar>("progress_bar")
                            if (bar != null) bar.progress = percent
                        }
                    }'''
        patched = patched.replace(oldBody, newBody)

        // Replace the legacy helper at the end of MainActivity.
        def helperStart = patched.indexOf('    private class CountingRequestBody(')
        if (helperStart < 0) {
            throw new GradleException('PhotoSync patch: CountingRequestBody class was not found')
        }
        def finalBrace = patched.lastIndexOf('\n}')
        if (finalBrace <= helperStart) {
            throw new GradleException('PhotoSync patch: MainActivity closing brace was not found')
        }
        def helper = '''    private class ProgressFileRequestBody(
        private val file: File,
        private val mediaType: MediaType?,
        private val onProgress: (written: Long, total: Long) -> Unit
    ) : RequestBody() {
        override fun contentType(): MediaType? = mediaType

        override fun contentLength(): Long = file.length()

        override fun writeTo(sink: BufferedSink) {
            val total = contentLength()
            var written = 0L
            file.inputStream().use { input ->
                val buffer = ByteArray(64 * 1024)
                while (true) {
                    val read = input.read(buffer)
                    if (read <= 0) break
                    sink.write(buffer, 0, read)
                    written += read
                    onProgress(written, total)
                }
            }
        }
    }
'''
        patched = patched.substring(0, helperStart) + helper + '}' + '\n'

        // Hard validation: never compile if the old sealed Okio implementation remains.
        if (patched.contains('CountingRequestBody') || patched.contains('ForwardingSink') || patched.contains('okio.buffer')) {
            throw new GradleException('PhotoSync patch validation failed: legacy CountingRequestBody/ForwardingSink code remains')
        }
        if (!patched.contains('class ProgressFileRequestBody')) {
            throw new GradleException('PhotoSync patch validation failed: ProgressFileRequestBody was not inserted')
        }

        sourceFile.write(patched, 'UTF-8')
        println 'PhotoSync upload-progress patch applied successfully.'
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) {
        task.dependsOn('patchUploadProgress')
    }
}
