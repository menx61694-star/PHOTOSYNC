name: Backend and Web Check

on:
  push:
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/backend-check.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/backend-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Import backend and build QR payload
        working-directory: backend
        run: python -c "import main; print(main._pc_qr_payload())"

      - name: Check dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          Path("/tmp/dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/dashboard.js
