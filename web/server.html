<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOTOSYNC Server</title><style>body{margin:0;background:#0b0f14;color:#f5f7fa;font-family:system-ui,sans-serif;padding:20px}.box{background:#11161d;border:1px solid #293242;border-radius:16px;padding:16px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.count{font-size:28px;font-weight:700}.phones{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.phone{background:#182131;border:1px solid #2b3950;border-radius:12px;padding:14px}.muted{color:#aab2bf;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button,input{border:0;border-radius:10px;padding:11px 14px;font-weight:600}button{background:#bca6ff;color:#17131f}input[type=file]{display:none}input[type=text]{background:#182131;color:#fff;border:1px solid #33415a;width:180px}.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#182131;border-radius:12px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.meta{padding:9px;font-size:12px;color:#c2cad8;word-break:break-word}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.error{padding:12px;border:1px solid #6b3434;border-radius:10px;color:#ffb4b4}.gate{max-width:440px;margin:12vh auto}.pin{font-size:24px;letter-spacing:6px;text-align:center;width:100%;box-sizing:border-box}@media(max-width:700px){.cols{grid-template-columns:1fr}}</style></head><body><div id="gate" class="box gate"><h1>PHOTOSYNC</h1><h2>Pair this browser</h2><p class="muted">Enter the 6-digit PIN shown in the server console.</p><input id="pin" class="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="PIN"><div class="row" style="margin-top:12px"><button onclick="pair()">Pair</button><span id="gateMsg" class="muted"></span></div></div><main id="app" style="display:none"><div class="box top"><div><h1 style="margin:0">PHOTOSYNC Server</h1><div class="muted" id="status">Connecting…</div></div><div><div class="muted">Connected phones</div><div class="count" id="count">0</div></div></div><div class="box"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Connected Phones</h2><button onclick="logout()">Unpair</button></div><div id="phones" class="phones"><div class="muted">No phone connected.</div></div></div><div class="box"><h2>Send to a phone</h2><div class="row"><select id="target"><option value="">Select phone</option></select><label><button onclick="pick()">Choose files</button><input id="file" type="file" multiple></label></div><div class="muted" style="margin-top:8px">Selected files go only to the selected phone's Downloads folder.</div><div id="queue"></div></div><div class="box"><h2>Server storage</h2><div id="storage"></div></div></main><script>let devices=[];const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}async function pair(){const p=$('pin').value.trim();const msg=$('gateMsg');if(!/^\d{6}$/.test(p)){msg.textContent='Enter a 6-digit PIN';return}try{const r=await fetch('/api/pair?pin='+encodeURIComponent(p),{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Pairing failed');showApp()}catch(e){msg.textContent=e.message}}async function check(){const r=await fetch('/api/session?ts='+Date.now(),{cache:'no-store'});if(r.ok){const d=await r.json();if(d.authorized){showApp();return true}}return false}function showApp(){$('gate').style.display='none';$('app').style.display='block';load()}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}function pick(){if(!$('target').value)return alert('Select a phone first');$('file').click()}$('file').onchange=()=>{[...$('file').files].forEach(upload);$('file').value=''}function upload(file){const fd=new FormData();fd.append('file',file);fd.append('source','web');fd.append('target_device_id',$('target').value);const x=document.createElement('div');x.className='box';x.textContent='Uploading '+file.name+'…';$('queue').prepend(x);fetch('/upload',{method:'POST',body:fd}).then(async r=>{if(!r.ok)throw new Error(await r.text());x.textContent='Uploaded ✓ '+file.name;load()}).catch(e=>x.textContent='Failed: '+e.message)}async function json(url){const r=await fetch(url+'&ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(url+' HTTP '+r.status);return r.json()}async function load(){try{const c=await json('/connections?');const stored=await json('/devices?');const connected=c.devices||[];const all=[...new Set([...(stored.devices||[]),...connected.map(p=>p.device_id)])];devices=connected;$('count').textContent=c.count||0;$('status').textContent='Server online';$('phones').innerHTML='';$('target').innerHTML='<option value="">Select phone</option>';if(!connected.length)$('phones').innerHTML='<div class="muted">No phone connected.</div>';connected.forEach((p,i)=>{const id=p.device_id;const d=document.createElement('div');d.className='phone';d.innerHTML='<b>Phone '+(i+1)+'</b><div class="muted">'+esc(id)+'</div><div class="muted">Connected now • Separate uploads/downloads</div>';$('phones').appendChild(d);const o=document.createElement('option');o.value=id;o.textContent='Phone '+(i+1);$('target').appendChild(o)});$('storage').innerHTML='';for(const id of all){const [u,d]=await Promise.all([json('/files?source=app&device_id='+encodeURIComponent(id)),json('/files?source=received&device_id='+encodeURIComponent(id))]);if(!u.length&&!d.length)continue;const box=document.createElement('div');box.className='box';box.innerHTML='<b>Device: '+esc(id)+'</b><div class="cols"><div><h3>Uploads</h3><div class="files">'+cards(u)+'</div></div><div><h3>Downloads</h3><div class="files">'+cards(d)+'</div></div></div>';$('storage').appendChild(box)}}catch(e){if(e.message.includes('401')){location.reload();return}$('status').textContent='Connection check failed';$('storage').innerHTML='<div class="error">Unable to load server storage: '+esc(e.message)+'</div>'}}function cards(a){if(!a.length)return '<div class="muted">None</div>';return a.map(p=>{const url=String(p.url||'');return p.type==='image'?'<div class="card"><img loading="lazy" src="'+esc(url)+'" onerror="this.style.display=\'none\';this.parentElement.insertAdjacentHTML(\'beforeend\',\'<div class=meta>Image could not be loaded</div>\')"><div class="meta">'+esc(p.filename)+'</div></div>':'<div class="card"><div style="aspect-ratio:1;display:grid;place-items:center;font-size:42px">📄</div><div class="meta">'+esc(p.filename)+'</div></div>'}).join('')}check().then(ok=>{if(!ok)$('pin').focus()});setInterval(()=>{if($('app').style.display!=='none')load()},3000)</script></body></html>
