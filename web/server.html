<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOTOSYNC Server</title><style>body{margin:0;background:#0b0f14;color:#f5f7fa;font-family:system-ui,sans-serif;padding:20px}.box{background:#11161d;border:1px solid #293242;border-radius:16px;padding:16px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.count{font-size:28px;font-weight:700}.phones{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.phone{background:#182131;border:1px solid #2b3950;border-radius:12px;padding:14px}.muted{color:#aab2bf;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button{border:0;border-radius:10px;padding:11px 14px;font-weight:600}button{background:#bca6ff;color:#17131f}input{display:none}.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#182131;border-radius:12px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover}.meta{padding:9px;font-size:12px;color:#c2cad8}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.cols{grid-template-columns:1fr}}</style></head><body><div class="box top"><div><h1 style="margin:0">PHOTOSYNC Server</h1><div class="muted" id="status">Connecting…</div></div><div><div class="muted">Connected phones</div><div class="count" id="count">0</div></div></div><div class="box"><h2>Connected Phones</h2><div id="phones" class="phones"><div class="muted">No phone connected.</div></div></div><div class="box"><h2>Send to a phone</h2><div class="row"><select id="target"><option value="">Select phone</option></select><label><button onclick="pick()">Choose files</button><input id="file" type="file" multiple></label></div><div class="muted" style="margin-top:8px">Selected files go only to the selected phone's Downloads folder.</div><div id="queue"></div></div><div class="box"><h2>Server storage</h2><div id="storage"></div></div><script>let devices=[];const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function pick(){if(!$('target').value)return alert('Select a phone first');$('file').click()}$('file').onchange=()=>{[...$('file').files].forEach(upload);$('file').value=''};function upload(file){const fd=new FormData();fd.append('file',file);fd.append('source','web');fd.append('target_device_id',$('target').value);const x=document.createElement('div');x.className='box';x.textContent='Uploading '+file.name+'…';$('queue').prepend(x);fetch('/upload',{method:'POST',body:fd}).then(async r=>{if(!r.ok)throw new Error(await r.text());x.textContent='Uploaded ✓ '+file.name;load()}).catch(e=>x.textContent='Failed: '+e.message)}async function load(){try{const c=await fetch('/connections?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json());devices=c.devices||[];$('count').textContent=c.count||0;$('status').textContent='Server online';$('phones').innerHTML='';$('target').innerHTML='<option value="">Select phone</option>';if(!devices.length)$('phones').innerHTML='<div class="muted">No phone connected.</div>';devices.forEach((p,i)=>{const id=p.device_id;const d=document.createElement('div');d.className='phone';d.innerHTML='<b>Phone '+(i+1)+'</b><div class="muted">'+esc(id)+'</div><div class="muted">Separate uploads/downloads</div>';$('phones').appendChild(d);const o=document.createElement('option');o.value=id;o.textContent='Phone '+(i+1);$('target').appendChild(o)});$('storage').innerHTML='';for(const p of devices){const id=p.device_id;const [u,d]=await Promise.all([fetch('/files?source=app&device_id='+encodeURIComponent(id)).then(r=>r.json()),fetch('/files?source=received&device_id='+encodeURIComponent(id)).then(r=>r.json())]);const box=document.createElement('div');box.className='box';box.innerHTML='<b>Phone '+esc(id)+'</b><div class="cols"><div><h3>Uploads</h3><div class="files">'+cards(u)+'</div></div><div><h3>Downloads</h3><div class="files">'+cards(d)+'</div></div></div>';$('storage').appendChild(box)}}catch(e){$('status').textContent='Connection check failed'}}function cards(a){if(!a.length)return '<div class="muted">None</div>';return a.map(p=>p.type==='image'?'<div class="card"><img src="'+p.url+'"><div class="meta">'+esc(p.filename)+'</div></div>':'<div class="card"><div style="aspect-ratio:1;display:grid;place-items:center;font-size:42px">📄</div><div class="meta">'+esc(p.filename)+'</div></div>').join('')}load();setInterval(load,3000)</script></body></html>
