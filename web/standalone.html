<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHOTOSYNC Web Client</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b0f14;color:#f5f7fa}header{padding:16px 20px;border-bottom:1px solid #252a33}.brand{font-size:28px;font-weight:700}.brand span{font-weight:300}.brand b{background:linear-gradient(90deg,#12e8ff,#ff4b4b);-webkit-background-clip:text;color:transparent}.wrap{max-width:1000px;margin:auto;padding:20px}.box{background:#11161d;border:1px solid #292f39;border-radius:14px;padding:16px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{flex:1;min-width:220px;padding:12px;border-radius:10px;border:1px solid #3a424f;background:#181c23;color:#fff}.btn{border:0;border-radius:10px;padding:12px 16px;background:#bca6ff;color:#17131f;font-weight:700;cursor:pointer}.status{color:#aab2bf}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#181c23;border:1px solid #292f39;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.meta{padding:10px;font-size:12px;color:#aab2bf}.empty{padding:30px;text-align:center;color:#8d96a5}.phones{font-size:14px;line-height:1.7}
</style>
</head>
<body>
<header><div class="brand"><span>photo</span><b>sync</b></div></header>
<div class="wrap">
<div class="box"><div class="row"><input id="server" placeholder="http://10.89.106.63:8000"><button class="btn" id="connect">Connect</button></div><p class="status" id="status">Enter the PhotoSync server URL.</p><div class="phones" id="phones">No server connected.</div></div>
<div class="box"><div class="row"><input id="files" type="file" multiple><button class="btn" id="send">Send to connected phones</button></div><p class="status" id="uploadStatus"></p></div>
<h2>📤 Sent Files</h2><div id="sent" class="grid"><div class="empty">No files sent from this web client yet.</div></div>
</div>
<script>
const server=document.getElementById('server'),connect=document.getElementById('connect'),status=document.getElementById('status'),phones=document.getElementById('phones'),files=document.getElementById('files'),send=document.getElementById('send'),uploadStatus=document.getElementById('uploadStatus'),sent=document.getElementById('sent');
let base=localStorage.getItem('photosync_server')||'';server.value=base;let webClientId=localStorage.getItem('photosync_web_client_id')||'';
function clean(v){return String(v||'').trim().replace(/\/$/,'')}
function setBase(){base=clean(server.value);if(!/^https?:\/\//i.test(base))base='http://'+base;server.value=base;localStorage.setItem('photosync_server',base)}
function api(path){return base+path}
async function ensureSession(){if(webClientId)return true;const r=await fetch(api('/web-client/session'),{method:'POST',cache:'no-store'});if(!r.ok)throw Error('Could not create private web session');const j=await r.json();webClientId=j.web_client_id;if(!webClientId)throw Error('Server did not return a web client ID');localStorage.setItem('photosync_web_client_id',webClientId);return true}
function card(p){if(!p||!p.url)return null;const c=document.createElement('article');c.className='card';if(p.type==='image'){const i=document.createElement('img');i.src=api(p.url);i.loading='lazy';c.appendChild(i)}else{const d=document.createElement('div');d.style='aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:42px';d.textContent='📄';c.appendChild(d)}const m=document.createElement('div');m.className='meta';m.textContent=(p.filename||'file')+' • '+(p.size||0)+' B';c.appendChild(m);return c}
function render(items){sent.innerHTML='';if(!items.length){sent.innerHTML='<div class="empty">No files sent from this web client yet.</div>';return}items.forEach(p=>{const c=card(p);if(c)sent.appendChild(c)})}
async function load(){if(!base||!webClientId)return;try{const [h,c]=await Promise.all([fetch(api('/web-client/files?web_client_id='+encodeURIComponent(webClientId)),{cache:'no-store'}),fetch(api('/connections'),{cache:'no-store'})]);if(!h.ok||!c.ok)throw Error('HTTP error');render(await h.json());const j=await c.json();phones.textContent='Connected phones: '+j.count+' '+j.devices.map(d=>d.device_id+' ('+d.ip+')').join(' • ');status.textContent='Connected to '+base}catch(e){status.textContent='Connection failed: '+e.message}}
connect.onclick=async()=>{try{setBase();webClientId='';localStorage.removeItem('photosync_web_client_id');await ensureSession();await load()}catch(e){status.textContent='Connection failed: '+e.message}};
send.onclick=async()=>{if(!base){uploadStatus.textContent='Connect to a server first';return}if(!files.files.length){uploadStatus.textContent='Select a file first';return}try{await ensureSession()}catch(e){uploadStatus.textContent=e.message;return}for(const f of files.files){const fd=new FormData();fd.append('file',f);fd.append('source','web');fd.append('web_client_id',webClientId);uploadStatus.textContent='Sending '+f.name+'…';try{const r=await fetch(api('/upload'),{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());uploadStatus.textContent='Sent ✓ '+f.name}catch(e){uploadStatus.textContent='Failed: '+e.message}}files.value='';load()};
(async()=>{if(base){try{await ensureSession();await load()}catch(e){status.textContent='Connection failed: '+e.message}}})();setInterval(load,3000);
</script>
</body>
</html>
