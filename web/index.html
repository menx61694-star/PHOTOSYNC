<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOTOSYNC</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b0f14;color:#f5f7fa}header{padding:16px 20px;border-bottom:1px solid #252a33;display:flex;justify-content:space-between}.brand{font-size:28px;font-weight:600}.brand span{font-weight:300}.brand b{background:linear-gradient(90deg,#12e8ff,#ff4b4b);-webkit-background-clip:text;color:transparent}.status{font-size:13px;color:#aab2bf}.toolbar,.box{padding:18px 20px}.uploadBox,.box{background:#11161d;border:1px solid #292f39;border-radius:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;background:#bca6ff;color:#17131f;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.hint{font-size:12px;color:#8d96a5}.phones{margin-top:10px}.phone{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #252a33}.tag{color:#36d399;font-size:12px}.pinbox{margin-top:14px;padding:14px;border:1px solid #292f39;border-radius:12px;background:#0f141b}.pinbox input{width:150px;padding:11px;border-radius:9px;border:1px solid #39414e;background:#0b0f14;color:#fff;font-size:20px;letter-spacing:5px;text-align:center}.pinbox button{margin-left:8px}.pinmsg{margin:8px 0 0;color:#ff9b9b;font-size:12px}.sectionTitle{padding:18px 20px 0;font-size:19px;font-weight:600}.grid{padding:14px 20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:#181c23;border:1px solid #292f39;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.fileCard{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:42px}.meta{padding:10px;font-size:12px;color:#aab2bf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;padding:35px;color:#8d96a5;grid-column:1/-1}</style></head><body><header><div class="brand"><span>photo</span><b>sync</b></div><div id="status" class="status">Connecting…</div></header><section class="toolbar"><div class="uploadBox"><div class="row"><input id="fileInput" type="file" multiple hidden><button id="choose" class="btn">Select Files</button><span class="hint">Send files to the paired phone</span></div><div id="queue"></div></div></section><section class="box"><strong>Connected phones</strong><div id="phones" class="phones">No phones connected.</div><p id="pairStatus" class="status">Pair one phone to this browser before sending or receiving files.</p><div id="pinBox" class="pinbox" hidden><div><strong>Enter the 6-digit PIN shown in the PhotoSync app/server.</strong></div><div style="margin-top:10px"><input id="pinInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button id="pairPin" class="btn">Pair</button><button id="cancelPin" class="btn">Cancel</button></div><div id="pinMsg" class="pinmsg"></div></div><button id="unpair" class="btn" hidden>Unpair</button></section><div class="sectionTitle">📤 Sent Files</div><main id="sentGallery" class="grid"></main><div class="sectionTitle">📥 Received Files</div><main id="receivedGallery" class="grid"></main><script>
const input=document.getElementById('fileInput'),choose=document.getElementById('choose'),sent=document.getElementById('sentGallery'),received=document.getElementById('receivedGallery'),phones=document.getElementById('phones'),pairStatus=document.getElementById('pairStatus'),unpair=document.getElementById('unpair'),status=document.getElementById('status'),queue=document.getElementById('queue'),pinBox=document.getElementById('pinBox'),pinInput=document.getElementById('pinInput'),pinMsg=document.getElementById('pinMsg'),pairPin=document.getElementById('pairPin'),cancelPin=document.getElementById('cancelPin');const KEY='photosync_web_client_id:dashboard';let cid=localStorage.getItem(KEY)||'',paired='',pendingDevice='';
choose.onclick=()=>input.click();input.onchange=()=>{[...input.files].forEach(upload);input.value=''};
async function session(force=false){if(force){cid='';localStorage.removeItem(KEY)}if(cid)return;const r=await fetch('/web-client/session',{method:'POST',cache:'no-store'});if(!r.ok)throw Error('session failed');cid=(await r.json()).web_client_id;localStorage.setItem(KEY,cid)}
function render(g,items,msg){g.innerHTML='';if(!items.length){g.innerHTML='<div class="empty">'+msg+'</div>';return}items.forEach(p=>{const c=document.createElement('article');c.className='card';if(p.type==='image'){const i=document.createElement('img');i.src=p.url+'?web_client_id='+encodeURIComponent(cid);c.appendChild(i)}else{const d=document.createElement('div');d.className='fileCard';d.textContent='📄';c.appendChild(d)}const m=document.createElement('div');m.className='meta';m.textContent=(p.filename||'file')+' • '+(p.size||0)+' B';c.appendChild(m);g.appendChild(c)})}
function askPin(d){pendingDevice=d;pinInput.value='';pinMsg.textContent='';pinBox.hidden=false;pinInput.focus()}
async function pair(){const d=pendingDevice;const pin=pinInput.value.trim();if(!d){pinMsg.textContent='Select a connected phone first.';return}if(!/^\d{6}$/.test(pin)){pinMsg.textContent='Enter exactly 6 digits.';return}pairPin.disabled=true;const fd=new FormData();fd.append('web_client_id',cid);fd.append('device_id',d);try{const r=await fetch('/web-client/pair',{method:'POST',headers:{'X-PhotoSync-Pair-PIN':pin},body:fd});if(!r.ok){let msg='Pairing failed';try{const j=await r.json();msg=j.detail||msg}catch(_){ }throw Error(msg)}pinBox.hidden=true;pendingDevice='';pinInput.value='';await load()}catch(e){pinMsg.textContent=e.message||'Pairing failed'}finally{pairPin.disabled=false}}
pairPin.onclick=pair;pinInput.onkeydown=e=>{if(e.key==='Enter')pair()};cancelPin.onclick=()=>{pinBox.hidden=true;pendingDevice='';pinInput.value='';pinMsg.textContent=''};
async function load(){if(!cid)return;try{const [authR,c]=await Promise.all([fetch('/api/session',{cache:'no-store'}),fetch('/connections',{cache:'no-store'})]);if(!authR.ok||!c.ok)throw Error('server unavailable');const auth=await authR.json(),co=await c.json();phones.innerHTML='';if(!co.devices.length)phones.textContent='No phones connected.';else co.devices.forEach(d=>{const r=document.createElement('div');r.className='phone';r.innerHTML='<span>📱 '+d.device_id+' ('+d.ip+')</span>';const b=document.createElement('button');b.className='btn';b.textContent=auth.authorized&&d.device_id===paired?'Paired':'Pair';b.disabled=auth.authorized&&d.device_id===paired;b.onclick=()=>askPin(d.device_id);r.appendChild(b);phones.appendChild(r)});if(!auth.authorized){paired='';status.textContent='PIN required';pairStatus.textContent=co.devices.length?'Enter the server PIN, then click Pair next to the phone you want to connect.':'No phones connected — open PhotoSync on a phone first.';unpair.hidden=true;pinBox.hidden=true;render(sent,[],'Pair this browser to view its private history.');render(received,[],'Pair this browser to view its private history.');return}const s=await fetch('/web-client/state?web_client_id='+encodeURIComponent(cid),{cache:'no-store'});if(!s.ok)throw Error('private session unavailable');const st=await s.json();paired=st.paired_device_id||'';status.textContent='Private browser session active';pairStatus.innerHTML=paired?'Paired: <span class="tag">'+paired+'</span>':'Not paired — choose Pair below';unpair.hidden=!paired;render(sent,st.sent,'No files sent from this browser yet.');render(received,st.received,'No files received by this browser yet.')}catch(e){status.textContent='Connection error: '+e.message}}
unpair.onclick=async()=>{const f=new FormData();f.append('web_client_id',cid);await fetch('/web-client/unpair',{method:'POST',body:f});load()};
async function upload(file){if(!paired){alert('Pair a phone first');return}const row=document.createElement('div');row.textContent='Uploading '+file.name+'…';queue.prepend(row);const f=new FormData();f.append('file',file);f.append('source','web');f.append('web_client_id',cid);f.append('target_device_id',paired);try{const r=await fetch('/upload',{method:'POST',body:f});if(!r.ok)throw Error(await r.text());row.textContent='Sent ✓ '+file.name;load()}catch(e){row.textContent='Failed: '+e.message}}
(async()=>{try{await session();await load()}catch(e){status.textContent='Server unavailable'}})();setInterval(load,3000);
</script></body></html>
