<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>PHOTOSYNC</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b0f14;color:#f5f7fa}header{padding:16px 20px;border-bottom:1px solid #252a33;display:flex;justify-content:space-between}.brand{font-size:28px;font-weight:600}.brand span{font-weight:300}.brand b{background:linear-gradient(90deg,#12e8ff,#ff4b4b);-webkit-background-clip:text;color:transparent}.status{font-size:13px;color:#aab2bf}.toolbar,.box{padding:18px 20px}.uploadBox,.box{background:#11161d;border:1px solid #292f39;border-radius:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;background:#bca6ff;color:#17131f;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.danger{background:#332027;color:#ffb4bd}.hint{font-size:12px;color:#8d96a5}.phones{margin-top:10px}.phone{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #252a33}.tag{color:#36d399;font-size:12px}.pinbox{margin-top:14px;padding:14px;border:1px solid #292f39;border-radius:12px;background:#0f141b}.pinbox input{width:150px;padding:11px;border-radius:9px;border:1px solid #39414e;background:#0b0f14;color:#fff;font-size:20px;letter-spacing:5px;text-align:center}.pinmsg{margin:8px 0 0;color:#ff9b9b;font-size:12px}.sectionTitle{padding:18px 20px 0;font-size:19px;font-weight:600}.grid{padding:14px 20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:#181c23;border:1px solid #292f39;border-radius:14px;overflow:hidden}.thumb{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}.videoThumb{width:100%;aspect-ratio:1;object-fit:cover;background:#05070a}.fileCard{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:42px}.meta{padding:10px;font-size:12px;color:#aab2bf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;padding:35px;color:#8d96a5;grid-column:1/-1}.progress{height:8px;background:#283447;border-radius:8px;overflow:hidden;margin:6px 0}.progress i{display:block;height:100%;width:0;background:#bca6ff}.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column}.modal.hidden{display:none}.modalTop{display:flex;justify-content:center;gap:8px;padding:12px;flex-wrap:wrap}.viewer{flex:1;display:flex;justify-content:center;align-items:center;overflow:auto}.viewer img{max-width:none;max-height:85vh;transform-origin:center}.viewer video{max-width:95vw;max-height:85vh}.viewer iframe{width:95vw;height:85vh;border:0;background:#fff}</style></head><body><header><div class="brand"><span>photo</span><b>sync</b></div><div id="status" class="status">Connecting…</div></header><section class="toolbar"><div class="uploadBox"><div class="row"><input id="fileInput" type="file" multiple hidden><button id="choose" class="btn" type="button">Select Files</button><button id="disconnect" class="btn danger" type="button" hidden>Disconnect</button><span class="hint">Send files to the paired phone</span></div><div id="queue"></div></div></section><section class="box"><strong>Connected phones</strong><div id="phones" class="phones">No phones connected.</div><p id="pairStatus" class="status">Pair one phone to this browser before sending or receiving files.</p><div id="pinBox" class="pinbox" hidden><div><strong>Enter the 6-digit PIN shown in the selected PhotoSync app.</strong></div><div style="margin-top:10px"><input id="pinInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button id="pairPin" class="btn" type="button">Connect</button><button id="cancelPin" class="btn" type="button">Cancel</button></div><div id="pinMsg" class="pinmsg"></div></div><button id="unpair" class="btn danger" type="button" hidden>Disconnect phone</button></section><div class="sectionTitle">📤 Sent Files</div><main id="sentGallery" class="grid"></main><div class="sectionTitle">📥 Received Files</div><main id="receivedGallery" class="grid"></main><div id="modal" class="modal hidden"><div class="modalTop"><button id="zoomOut" class="btn">−</button><button id="zoomReset" class="btn">100%</button><button id="zoomIn" class="btn">+</button><a id="download" class="btn" download>Download</a><button id="close" class="btn danger">Close</button></div><div id="viewer" class="viewer"></div></div><script>
const input=document.getElementById('fileInput'),choose=document.getElementById('choose'),sent=document.getElementById('sentGallery'),received=document.getElementById('receivedGallery'),phones=document.getElementById('phones'),pairStatus=document.getElementById('pairStatus'),unpair=document.getElementById('unpair'),disconnect=document.getElementById('disconnect'),status=document.getElementById('status'),queue=document.getElementById('queue'),pinBox=document.getElementById('pinBox'),pinInput=document.getElementById('pinInput'),pinMsg=document.getElementById('pinMsg'),pairPin=document.getElementById('pairPin');const KEY='photosync_web_client_id:dashboard';let cid=localStorage.getItem(KEY)||'',paired='',pendingDevice=null,pinPromptOpen=false;
choose.onclick=()=>input.click();input.onchange=()=>{[...input.files].forEach(upload);input.value=''};
async function session(){if(cid)return;const r=await fetch('/web-client/session',{method:'POST',cache:'no-store'});if(!r.ok)throw Error('session failed');cid=(await r.json()).web_client_id;localStorage.setItem(KEY,cid)}
function fmt(n){n=Number(n)||0;const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}
function openViewer(p){const modal=document.getElementById('modal'),viewer=document.getElementById('viewer');modal.classList.remove('hidden');viewer.innerHTML='';let el;if(p.type==='image'){el=document.createElement('img');el.src=p.url;el.dataset.scale='1';el.style.transform='scale(1)'}else if(p.type==='video'){el=document.createElement('video');el.src=p.url;el.controls=true;el.autoplay=true}else{el=document.createElement('iframe');el.src=p.url}viewer.appendChild(el);document.getElementById('download').href=p.url;document.getElementById('download').download=p.filename||'file';document.getElementById('zoomIn').onclick=()=>{if(p.type==='image'){let s=Number(el.dataset.scale)+.25;el.dataset.scale=s;el.style.transform='scale('+s+')'}};document.getElementById('zoomOut').onclick=()=>{if(p.type==='image'){let s=Math.max(.25,Number(el.dataset.scale)-.25);el.dataset.scale=s;el.style.transform='scale('+s+')'}};document.getElementById('zoomReset').onclick=()=>{if(p.type==='image'){el.dataset.scale='1';el.style.transform='scale(1)'}}}
document.getElementById('close').onclick=()=>{document.getElementById('modal').classList.add('hidden');document.getElementById('viewer').innerHTML=''};
function render(g,items,msg){g.innerHTML='';if(!items.length){g.innerHTML='<div class=empty>'+msg+'</div>';return}items.forEach(p=>{const c=document.createElement('article');c.className='card';if(p.type==='image'){const i=document.createElement('img');i.className='thumb';i.src=p.url+'?web_client_id='+encodeURIComponent(cid);c.appendChild(i)}else if(p.type==='video'){const v=document.createElement('video');v.className='videoThumb';v.src=p.url+'?web_client_id='+encodeURIComponent(cid);v.muted=true;v.preload='metadata';c.appendChild(v)}else{const d=document.createElement('div');d.className='fileCard';d.textContent=p.type==='pdf'?'📕':'📄';c.appendChild(d)}c.onclick=e=>{if(e.target.closest('a'))return;openViewer(p)};const m=document.createElement('div');m.className='meta';m.innerHTML=esc(p.filename||'file')+' • '+fmt(p.size)+'<br><a class="btn" style="display:inline-block;margin-top:7px;text-decoration:none" href="'+esc(p.url)+'?web_client_id='+encodeURIComponent(cid)+'" download="'+esc(p.filename||'file')+'">Download</a>';c.appendChild(m);g.appendChild(c)})}
function askPin(d){pendingDevice=d;pinPromptOpen=true;pinInput.value='';pinMsg.textContent='';pinBox.hidden=false;pinInput.focus()}
async function pair(){const d=pendingDevice,pin=pinInput.value.trim();if(!d){pinMsg.textContent='Select a connected phone first.';return}if(!/^\d{6}$/.test(pin)){pinMsg.textContent='Enter exactly 6 digits.';return}pairPin.disabled=true;try{const r=await fetch('/web-client/pair',{method:'POST',headers:{'X-PhotoSync-Pair-PIN':pin,'X-PhotoSync-Device-IP':d.ip,'X-PhotoSync-Device-ID':d.device_id},body:new URLSearchParams({web_client_id:cid,device_id:d.device_id}),cache:'no-store'});if(!r.ok){let msg='Pairing failed';try{const j=await r.json();msg=j.detail||msg}catch(_){ }throw Error(msg)}pinPromptOpen=false;pinBox.hidden=true;pendingDevice=null;pinInput.value='';await load()}catch(e){pinMsg.textContent=e.message||'Pairing failed'}finally{pairPin.disabled=false}}
pairPin.onclick=pair;pinInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();pair()}};document.getElementById('cancelPin').onclick=()=>{pinPromptOpen=false;pinBox.hidden=true;pendingDevice=null;pinInput.value='';pinMsg.textContent=''};
unpair.onclick=async()=>{const f=new FormData();f.append('web_client_id',cid);await fetch('/web-client/unpair',{method:'POST',body:f,cache:'no-store'});paired='';load()};disconnect.onclick=async()=>{try{await fetch('/api/logout',{method:'POST',cache:'no-store'})}finally{paired='';disconnect.hidden=true;unpair.hidden=true;load()}};
async function load(){if(!cid||pinPromptOpen)return;try{const [authR,c]=await Promise.all([fetch('/api/session',{cache:'no-store'}),fetch('/connections',{cache:'no-store'})]);if(!authR.ok||!c.ok)throw Error('server unavailable');const auth=await authR.json(),co=await c.json();phones.innerHTML='';if(!co.devices.length)phones.textContent='No phones connected.';else co.devices.forEach(d=>{const r=document.createElement('div');r.className='phone';const label=document.createElement('span');label.textContent='📱 '+(d.device_id||d.id||'Phone')+' ('+(d.ip||'unknown')+')';r.appendChild(label);const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=auth.authorized&&(d.device_id||d.id)===paired?'Connected':'Connect';b.disabled=auth.authorized&&(d.device_id||d.id)===paired;b.onclick=()=>askPin({device_id:d.device_id||d.id,ip:d.ip});r.appendChild(b);phones.appendChild(r)});if(!auth.authorized){paired='';status.textContent='PIN required';disconnect.hidden=true;pairStatus.textContent=co.devices.length?'Select a phone and enter the PIN shown inside that PhotoSync app.':'No phones connected — open PhotoSync on a phone first.';unpair.hidden=true;render(sent,[],'Connect this browser to view its private history.');render(received,[],'Connect this browser to view its private history.');return}const s=await fetch('/web-client/state?web_client_id='+encodeURIComponent(cid),{cache:'no-store'});if(!s.ok)throw Error('private session unavailable');const st=await s.json();paired=st.paired_device_id||'';status.textContent='Connected • private browser session';disconnect.hidden=false;pairStatus.innerHTML=paired?'Paired phone: <span class=tag>'+esc(paired)+'</span>':'Choose a phone to connect';unpair.hidden=!paired;render(sent,st.sent,'No files sent from this browser yet.');render(received,st.received,'No files received by this browser yet.')}catch(e){status.textContent='Connection error: '+e.message}}
async function upload(file){if(!paired){alert('Connect a phone first');return}const row=document.createElement('div');row.className='box';row.innerHTML='<b>'+esc(file.name)+'</b><div class=progress><i></i></div><span>0%</span> <button class="btn danger">Cancel</button>';queue.prepend(row);const bar=row.querySelector('i'),label=row.querySelector('span'),cancel=row.querySelector('button');const xhr=new XMLHttpRequest();xhr.open('POST','/upload');xhr.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);bar.style.width=p+'%';label.textContent=p+'% • '+fmt(e.loaded)+' / '+fmt(e.total)}};xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300){label.textContent='Sent ✓';bar.style.width='100%';load()}else label.textContent='Failed: '+xhr.responseText};xhr.onerror=()=>label.textContent='Network error';xhr.onabort=()=>label.textContent='Cancelled';cancel.onclick=()=>xhr.abort();const f=new FormData();f.append('file',file);f.append('source','web');f.append('web_client_id',cid);f.append('target_device_id',paired);xhr.send(f)}
(async()=>{try{await session();await load()}catch(e){status.textContent='Server unavailable'}})();setInterval(load,3000);
</script></body></html>
