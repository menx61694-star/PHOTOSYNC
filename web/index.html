<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOTOSYNC</title><meta name="theme-color" content="#0b0f14"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b0f14;color:#f5f7fa}header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252a33}.brand{font-size:28px;font-weight:600}.brand span{font-weight:300}.brand b{background:linear-gradient(90deg,#12e8ff,#ff4b4b);-webkit-background-clip:text;color:transparent}.status{font-size:13px;color:#aab2bf}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:7px}.online .dot{background:#36d399}.toolbar{padding:18px 20px 4px}.uploadBox{border:1px dashed #3a424f;border-radius:14px;padding:16px;background:#11161d}.uploadRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;background:#bca6ff;color:#17131f;font-weight:600;cursor:pointer}.hint{font-size:12px;color:#8d96a5}.queue{margin-top:12px;display:grid;gap:7px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;background:#181c23;border:1px solid #292f39;border-radius:9px;padding:9px 10px;font-size:12px}.itemName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:5px;border-radius:5px;background:#303743;overflow:hidden;margin-top:5px}.fill{height:100%;width:0;background:#36d399}.state{color:#aab2bf}.sectionTitle{padding:18px 20px 0;font-size:19px;font-weight:600}.grid{padding:14px 20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;min-height:80px}.card{background:#181c23;border:1px solid #292f39;border-radius:14px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.fileCard{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:42px;background:#141922}.meta{padding:10px;font-size:12px;color:#aab2bf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;padding:35px;color:#8d96a5;grid-column:1/-1}.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;overflow:hidden;z-index:10;touch-action:none}.viewer.open{display:flex}.viewerStage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}.viewerImage{max-width:90vw;max-height:85vh;object-fit:contain;transform:translate(0px,0px) scale(1);cursor:zoom-in;user-select:none;-webkit-user-drag:none;touch-action:none}.zoomed{cursor:grab}.zoomControls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:12}.zoomBtn{border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;width:44px;height:44px;border-radius:10px}.zoomLevel{min-width:58px;text-align:center;line-height:44px;color:#fff;background:rgba(255,255,255,.1);border-radius:10px;font-size:13px}.close{position:fixed;top:16px;right:20px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:30px;width:44px;height:44px;border-radius:50%;z-index:12}.section{display:block}</style></head><body><header><div class="brand"><span>photo</span><b>sync</b></div><div id="status" class="status"><span class="dot"></span>Connecting…</div></header><section class="toolbar"><div class="uploadBox"><div class="uploadRow"><input id="fileInput" type="file" multiple hidden><button id="choose" class="btn">Select Files</button><span class="hint">Send files to the connected app</span></div><div id="queue" class="queue"></div></div></section><div class="section"><div class="sectionTitle">📤 Sent Files</div><main id="sentGallery" class="grid"><div class="empty">No files sent from web yet.</div></main></div><div class="section"><div class="sectionTitle">📥 Received Files</div><main id="receivedGallery" class="grid"><div class="empty">No files received from app yet.</div></main></div><div id="viewer" class="viewer"><button id="close" class="close">×</button><div class="zoomControls"><button id="zoomOut" class="zoomBtn">−</button><div id="zoomLevel" class="zoomLevel">100%</div><button id="zoomIn" class="zoomBtn">+</button><button id="zoomReset" class="zoomBtn">↺</button></div><div id="viewerStage" class="viewerStage"><img id="viewerImage" class="viewerImage"></div></div><script>
const sentGallery=document.getElementById('sentGallery'),receivedGallery=document.getElementById('receivedGallery'),status=document.getElementById('status'),input=document.getElementById('fileInput'),queue=document.getElementById('queue'),viewer=document.getElementById('viewer'),stage=document.getElementById('viewerStage'),vi=document.getElementById('viewerImage'),zoomLevel=document.getElementById('zoomLevel');
let zoom=1,panX=0,panY=0,pinchStart=0,pinchZoom=1,polling=false;
const choose=document.getElementById('choose');
choose.onclick=()=>input.click();
input.onchange=()=>{[...input.files].forEach(upload);input.value=''};
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function target(source){return source==='web'?sentGallery:receivedGallery}
function keyOf(p){return (p.device_id||'')+':'+(p.stored_filename||'')}
function removeEmpty(g){const empty=g.querySelector('.empty');if(empty)empty.remove()}
function showEmptyIfNeeded(g,text){if(!g.children.length)g.innerHTML='<div class="empty">'+text+'</div>'}
function add(p,prepend=true){
  if(!p||!p.stored_filename||!['web','app','received'].includes(p.source))return;
  const g=target(p.source),key=keyOf(p),existing=g.querySelector('[data-file="'+CSS.escape(key)+'"]');
  if(existing)return;
  removeEmpty(g);
  const c=document.createElement('article');c.className='card';c.dataset.file=key;
  if(p.type==='image'){
    const i=document.createElement('img');i.src=new URL(p.url,location.href).href;i.loading='lazy';i.onerror=()=>{i.alt='Image unavailable'};c.appendChild(i);c.onclick=()=>openViewer(i.src)
  }else{const d=document.createElement('div');d.className='fileCard';d.textContent='📄';c.appendChild(d);c.onclick=()=>window.open(new URL(p.url,location.href).href,'_blank')}
  const m=document.createElement('div');m.className='meta';m.textContent=(p.filename||'')+' • '+(p.device_id||'');c.appendChild(m);
  prepend?g.prepend(c):g.append(c)
}
function syncGallery(g,items,emptyText){
  const wanted=new Map(items.map(p=>[keyOf(p),p]));
  [...g.querySelectorAll('.card')].forEach(c=>{if(!wanted.has(c.dataset.file))c.remove()});
  items.slice().reverse().forEach(p=>add(p,false));
  if(!items.length)g.innerHTML='<div class="empty">'+emptyText+'</div>';else removeEmpty(g)
}
async function load(source,g){
  try{
    const r=await fetch('/files?source='+source+'&all=true&ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const ps=await r.json();syncGallery(g,ps,source==='web'?'No files sent from web yet.':'No files received from app yet.')
  }catch(e){console.error(e)}
}
function loadAll(){return Promise.all([load('web',sentGallery),load('app',receivedGallery)])}
function upload(file){
  const row=document.createElement('div');row.className='item';row.innerHTML='<div><div class="itemName">'+esc(file.name)+'</div><div class="bar"><div class="fill"></div></div></div><div class="state">Queued</div>';queue.prepend(row);
  const fill=row.querySelector('.fill'),state=row.querySelector('.state'),xhr=new XMLHttpRequest();xhr.open('POST','/upload');
  xhr.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);fill.style.width=p+'%';state.textContent=p+'%'}};
  xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300){fill.style.width='100%';state.textContent='Uploaded ✓';try{add(JSON.parse(xhr.responseText),true)}catch{load('web',sentGallery)}}else state.textContent='Failed'};
  xhr.onerror=()=>state.textContent='Failed';const f=new FormData();f.append('file',file);f.append('source','web');state.textContent='Uploading…';xhr.send(f)
}
function setZoom(v){zoom=Math.max(.5,Math.min(5,v));vi.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';zoomLevel.textContent=Math.round(zoom*100)+'%';vi.classList.toggle('zoomed',zoom>1)}
function resetView(){zoom=1;panX=0;panY=0;setZoom(1)}
function openViewer(src){vi.src=src;resetView();viewer.classList.add('open')}
document.getElementById('zoomIn').onclick=()=>setZoom(zoom+.25);document.getElementById('zoomOut').onclick=()=>setZoom(zoom-.25);document.getElementById('zoomReset').onclick=resetView;
vi.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom+(e.deltaY<0?.2:-.2))},{passive:false});vi.addEventListener('dblclick',()=>setZoom(zoom>1?1:2));
let dragging=false,lastX=0,lastY=0;vi.addEventListener('pointerdown',e=>{if(zoom<=1)return;dragging=true;lastX=e.clientX;lastY=e.clientY;vi.setPointerCapture(e.pointerId)});vi.addEventListener('pointermove',e=>{if(!dragging)return;panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;setZoom(zoom)});vi.addEventListener('pointerup',()=>dragging=false);vi.addEventListener('pointercancel',()=>dragging=false);
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchZoom=zoom}},{passive:true});stage.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setZoom(pinchZoom*(d/pinchStart))}},{passive:false});
document.getElementById('close').onclick=()=>{viewer.classList.remove('open');vi.removeAttribute('src');resetView()};viewer.onclick=e=>{if(e.target===viewer)document.getElementById('close').click()};
async function livePoll(){if(polling)return;polling=true;try{await loadAll()}finally{polling=false}}
function connect(){const w=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');w.onopen=()=>{status.classList.add('online');status.innerHTML='<span class="dot"></span>Connected';loadAll()};w.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='file_uploaded')add(d,true)}catch{}};w.onclose=()=>{status.classList.remove('online');status.innerHTML='<span class="dot"></span>Reconnecting…';setTimeout(connect,1500)};w.onerror=()=>w.close()}
loadAll();connect();setInterval(livePoll,2000);
</script></body></html>
