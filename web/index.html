<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOTOSYNC</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f5f7fa}header{padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid #252a33}h1{margin:0;font-size:22px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:7px}.online .dot{background:#36d399}.grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:#181c23;border:1px solid #292f39;border-radius:14px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.meta{padding:10px;font-size:12px;color:#aab2bf}.empty{text-align:center;padding:50px;color:#8d96a5}.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;overflow:hidden;z-index:10}.viewer.open{display:flex}.viewerImage{max-width:90vw;max-height:85vh;object-fit:contain;transform:translate(0,0) scale(1);transform-origin:center;user-select:none;touch-action:none;cursor:grab}.viewerImage.dragging{cursor:grabbing}.close,.zoomBtn{border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}.close{position:fixed;top:16px;right:20px;font-size:30px;width:44px;height:44px;border-radius:50%;z-index:12}.controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(20,20,20,.85);padding:8px;border-radius:14px;z-index:12}.zoomBtn{font-size:22px;width:46px;height:42px;border-radius:9px}.zoomLevel{min-width:62px;text-align:center;line-height:42px;font-size:13px}</style></head><body><header><h1>PHOTOSYNC</h1><div id="status"><span class="dot"></span>Connecting…</div></header><main id="gallery" class="grid"><div class="empty">Loading photos…</div></main><div id="viewer" class="viewer"><button id="close" class="close">×</button><img id="viewerImage" class="viewerImage" draggable="false"><div class="controls"><button id="out" class="zoomBtn">−</button><div id="level" class="zoomLevel">100%</div><button id="in" class="zoomBtn">+</button><button id="reset" class="zoomBtn">↺</button></div></div><script>
const gallery=document.getElementById('gallery'),status=document.getElementById('status'),viewer=document.getElementById('viewer'),vi=document.getElementById('viewerImage'),level=document.getElementById('level');let scale=1,x=0,y=0,drag=false,sx=0,sy=0,ox=0,oy=0;
function transform(){vi.style.transform=`translate(${x}px,${y}px) scale(${scale})`;level.textContent=Math.round(scale*100)+'%'}function zoom(v){scale=Math.max(.5,Math.min(5,v));if(scale===1)x=y=0;transform()}function openPhoto(u){vi.src=new URL(u,location.href).href;scale=1;x=y=0;transform();viewer.classList.add('open')}function closePhoto(){viewer.classList.remove('open');vi.removeAttribute('src')}document.getElementById('close').onclick=closePhoto;viewer.onclick=e=>{if(e.target===viewer)closePhoto()};document.getElementById('in').onclick=()=>zoom(scale+.25);document.getElementById('out').onclick=()=>zoom(scale-.25);document.getElementById('reset').onclick=()=>zoom(1);vi.onwheel=e=>{e.preventDefault();zoom(scale+(e.deltaY<0?.25:-.25))};vi.onpointerdown=e=>{if(scale<=1)return;drag=true;sx=e.clientX;sy=e.clientY;ox=x;oy=y;vi.classList.add('dragging');vi.setPointerCapture(e.pointerId)};vi.onpointermove=e=>{if(drag){x=ox+e.clientX-sx;y=oy+e.clientY-sy;transform()}};vi.onpointerup=()=>{drag=false;vi.classList.remove('dragging')};document.onkeydown=e=>{if(e.key==='Escape')closePhoto();if(!viewer.classList.contains('open'))return;if(e.key==='+'||e.key==='=')zoom(scale+.25);if(e.key==='-')zoom(scale-.25);if(e.key==='0')zoom(1)};
function add(p,prepend=true){if(gallery.querySelector('.empty'))gallery.innerHTML='';const c=document.createElement('article');c.className='card';const i=document.createElement('img');i.src=new URL(p.url,location.href).href;i.loading='lazy';const m=document.createElement('div');m.className='meta';m.textContent=p.filename||'';c.onclick=()=>openPhoto(i.src);c.append(i,m);prepend?gallery.prepend(c):gallery.append(c)}async function load(){try{const r=await fetch('/photos');const ps=await r.json();gallery.innerHTML='';if(!ps.length){gallery.innerHTML='<div class="empty">Waiting for photos…</div>'}else ps.forEach(p=>add(p,false))}catch{gallery.innerHTML='<div class="empty">Unable to load photos.</div>'}}function connect(){const w=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);w.onopen=()=>{status.classList.add('online');status.innerHTML='<span class="dot"></span>Connected'};w.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='photo_uploaded')add(d)}catch{}};w.onclose=()=>{status.classList.remove('online');status.innerHTML='<span class="dot"></span>Reconnecting…';setTimeout(connect,1500)};w.onerror=()=>w.close()}load();connect();</script></body></html>
